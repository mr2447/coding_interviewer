AWSTemplateFormatVersion: 2010-09-09
Description: Template for AI assisted coding platform

Parameters:
  NetworkTemplateURL:
    Type: String
  RDSLayerArn:
    Type: String
  DBHost:
    Type: String
  DBUser:
    Type: String
  DBPass:
    Type: String
  DBName:
    Type: String
  DBPort:
    Type: String
  RDSArn:
    Type: String
#  APIGatewayInvokeURL:
#    Type: String

Resources:
  #Nest stack for network layer
  NetworkLayerStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Ref NetworkTemplateURL
      TimeoutInMinutes: 5
####################IAMRoles##################
  ReceiveSubmissionIAMRole:
    Type: AWS::IAM::Role
    Properties:
      #Allows lambda instances to assume this role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      # Provides permissions to lambda
      Policies:
        - PolicyName: ReceiveSubmission
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CodeQueue.Arn

  InvokeFargateIAMRole:
    Type: AWS::IAM::Role
    Properties:
      #Allows lambda instances to assume this role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeFargatePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:GetQueueAttributes
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt CodeQueue.Arn
              - Effect: Allow
                Action: rds-data:ExecuteStatement
                Resource: !Ref RDSArn
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref CodeRunTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt CodeRunTaskRole.Arn
                  - !GetAtt CodeRunExecutionRole.Arn

  RelayResultsIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RelayResultsPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-data:ExecuteStatement
                Resource: !Ref RDSArn
  # May or may not be necessary
  #    Policies:
  #      - PolicyName: InvokeApiGateway
  #        PolicyDocument:
  #          Version: "2012-10-17"
  #          Statement:
  #            - Effect: Allow
  #              Action:
  #                - execute-api:Invoke
  #              Resource:
  #                - arn:aws:execute-api:*:*:*/POST/*
  #                - arn:aws:execute-api:*:*:*/GET/*

  CodeRunExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  CodeRunTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeRunPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RelayResults.Arn

#########################Lambdas###############
  ReceiveSubmission:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt ReceiveSubmissionIAMRole.Arn
      Runtime: python3.12
      FunctionName: receive-submission
      Environment:
        Variables:
          CodeQueueURL: !Ref CodeQueue
      Code:
        ZipFile: |
          def lambda_handler(event, context):
            return "Hello World!"
      Handler: index.lambda_handler
      Timeout: 15

  InvokeFargate:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt InvokeFargateIAMRole.Arn
      Runtime: python3.12
      FunctionName: invoke-fargate
      Environment:
        Variables:
          #Variables for ECS task
          Subnets: !GetAtt NetworkLayerStack.Outputs.PrivateSubnet1
          SecurityGroup: !GetAtt NetworkLayerStack.Outputs.ComputeSecurityGroup
          Cluster: !Ref CodeRunCluster
          TaskDef: !Ref CodeRunTaskDefinition
          ContainerName: "code-run-image-python"
          RelayResults: !Ref RelayResults
          #Variables for DB queries
          DB_Host: !Ref DBHost
          DB_User: !Ref DBUser
          DB_Pass: !Ref DBPass
          DB_Name: !Ref DBName
          DB_Port: !Ref DBPort
          CodeQueueURL: !Ref CodeQueue
      Code:
        ZipFile: |
          def lambda_handler(event, context):
            return "Hello World!"
      Layers:
        - !Ref RDSLayerArn
      Handler: index.lambda_handler
      Timeout: 15

  RelayResults:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt RelayResultsIAMRole.Arn
      Runtime: python3.12
      FunctionName: relay-results
      Environment:
        Variables:
          DB_Host: !Ref DBHost
          DB_User: !Ref DBUser
          DB_Pass: !Ref DBPass
          DB_Name: !Ref DBName
          #May not be necessary
#          APIGatewayInvokeURL: !Ref APIGatewayInvokeURL
      Code:
        ZipFile: |
          def lambda_handler(event, context):
            return "Hello World!"
      Layers:
        - !Ref RDSLayerArn
      Handler: index.lambda_handler
      Timeout: 15

###########Other Resources###########
  CodeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: CodeQueue
      MaximumMessageSize: 10240
      MessageRetentionPeriod: 3600
      ReceiveMessageWaitTimeSeconds: 10
      #Dead letter queue settings currently not implemented.

  ReceiveFromQueueSQSTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CodeQueue.Arn
      FunctionName: !Ref InvokeFargate
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      Enabled: True

  CodeRunCluster:
    Type: AWS::ECS::Cluster
    Properties:
      CapacityProviders:
        - FARGATE

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"

  CodeRunTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ExecutionRoleArn: !GetAtt CodeRunExecutionRole.Arn
      TaskRoleArn: !GetAtt CodeRunTaskRole.Arn
      Cpu: "256"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ContainerDefinitions:
        - Name: code-run-image-python
          Image: 346225466066.dkr.ecr.us-east-2.amazonaws.com/code-run-image-python:latest
          Essential: true
          #MemoryReservation could be implemented later so that less memory is used when 1 GB isn't needed
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: Code-Run-Container