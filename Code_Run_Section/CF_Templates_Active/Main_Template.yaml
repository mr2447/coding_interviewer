AWSTemplateFormatVersion: 2010-09-09
Description: Template for AI assisted coding platform

Parameters:
  NetworkTemplateURL:
    Type: String
  RDSLayerArn:
    Type: String
  DBHost:
    Type: String
  DBUser:
    Type: String
  DBPass:
    Type: String
  DBName:
    Type: String
  DBPort:
    Type: String
  RDSArn:
    Type: String
  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket name where Lambda function code is stored
    Default: cftemplates346225466066us-east-2 
  LambdaCodeS3KeyPrefix:
    Type: String
    Description: S3 key prefix for Lambda function code (e.g., 'lambda-functions/')
    Default: lambda-functions/
  UserPoolId:
    Type: String
    Description: Cognito User Pool ID (e.g., us-east-2_xxxxx)
    Default: us-east-2_jSbGE8cJ3

Resources:
  # Note: LambdaCodeS3Bucket parameter references an existing S3 bucket
  # The bucket should already exist (cftemplates346225466066us-east-2)
  # We don't create it here to avoid conflicts with existing buckets

  #Nest stack for network layer
  NetworkLayerStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Ref NetworkTemplateURL
      TimeoutInMinutes: 5
####################IAMRoles##################
  ReceiveSubmissionIAMRole:
    Type: AWS::IAM::Role
    Properties:
      #Allows lambda instances to assume this role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      # Provides permissions to lambda
      Policies:
        - PolicyName: ReceiveSubmission
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CodeQueue.Arn

  InvokeFargateIAMRole:
    Type: AWS::IAM::Role
    Properties:
      #Allows lambda instances to assume this role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeFargatePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:GetQueueAttributes
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt CodeQueue.Arn
              - Effect: Allow
                Action: rds-data:ExecuteStatement
                Resource: !Ref RDSArn
              - Effect: Allow
                Action: ecs:RunTask
                Resource:
                  - !Ref CodeRunTaskDefinitionPython
                  - !Ref CodeRunTaskDefinitionCpp
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt CodeRunTaskRole.Arn
                  - !GetAtt CodeRunExecutionRole.Arn

  RelayResultsIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        # Removed AWSLambdaVPCAccessExecutionRole - Lambda no longer in VPC
      Policies:
        - PolicyName: RelayResultsPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: '*'
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                  - execute-api:Invoke
                # For API Gateway Management API post_to_connection, need @connections/* path
                Resource:
                  - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/prod/@connections/*"
                  - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/@connections/*"
                  - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
                  - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ConnectionsTable.Arn
                  - !Sub "${ConnectionsTable.Arn}/index/*"
              - Effect: Allow
                Action: rds-data:ExecuteStatement
                Resource: !Ref RDSArn

  CodeRunExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  CodeRunTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeRunPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RelayResults.Arn

  CognitoPostConfirmationIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      # Note: No inline policies needed - psycopg2 uses direct connection (username/password)
      # RDS Data API permissions not required for direct PostgreSQL connections

#########################Lambdas###############
  ReceiveSubmission:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt ReceiveSubmissionIAMRole.Arn
      Runtime: python3.12
      FunctionName: receive-submission
      Environment:
        Variables:
          CodeQueueURL: !Ref CodeQueue
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Sub "${LambdaCodeS3KeyPrefix}receive-submission.zip"
      Handler: index.lambda_handler
      Timeout: 15

  InvokeFargate:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt InvokeFargateIAMRole.Arn
      Runtime: python3.12
      FunctionName: invoke-fargate
      Environment:
        Variables:
          #Variables for ECS task
          Subnets: !GetAtt NetworkLayerStack.Outputs.PrivateSubnet1
          SecurityGroup: !GetAtt NetworkLayerStack.Outputs.ComputeSecurityGroup
          Cluster: !Ref CodeRunCluster
          TaskDefPython: !Ref CodeRunTaskDefinitionPython
          TaskDefCpp: !Ref CodeRunTaskDefinitionCpp
          ContainerName: "code-run-image-python"
          TargetLambda: !Ref RelayResults
          #Variables for DB queries
          DB_Host: !Ref DBHost
          DB_User: !Ref DBUser
          DB_Pass: !Ref DBPass
          DB_Name: !Ref DBName
          DB_Port: !Ref DBPort
          CodeQueueURL: !Ref CodeQueue
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Sub "${LambdaCodeS3KeyPrefix}invoke-fargate.zip"
      Layers:
        - !Ref RDSLayerArn
      Handler: index.lambda_handler
      Timeout: 15

  RelayResults:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt RelayResultsIAMRole.Arn
      Runtime: python3.12
      FunctionName: relay-results
      Environment:
        Variables:
          WEBSOCKET_API_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          DB_Host: !Ref DBHost
          DB_User: !Ref DBUser
          DB_Pass: !Ref DBPass
          DB_Name: !Ref DBName
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Sub "${LambdaCodeS3KeyPrefix}relay-results.zip"
      Layers:
        - !Ref RDSLayerArn
      Handler: index.lambda_handler
      #Timeout of 30 seconds chosen due to latency concern of RDS and DynamoDB
      Timeout: 30

  CognitoPostConfirmation:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt CognitoPostConfirmationIAMRole.Arn
      Runtime: python3.12
      FunctionName: cognito-post-confirmation
      Environment:
        Variables:
          DB_Host: !Ref DBHost
          DB_User: !Ref DBUser
          DB_Pass: !Ref DBPass
          DB_Name: !Ref DBName
          DB_Port: !Ref DBPort
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Sub "${LambdaCodeS3KeyPrefix}cognito-post-confirmation.zip"
      Layers:
        - !Ref RDSLayerArn
      Handler: index.lambda_handler
      Timeout: 15
      VpcConfig:
        SubnetIds:
          - !GetAtt NetworkLayerStack.Outputs.PrivateSubnet1
        SecurityGroupIds:
          - !GetAtt NetworkLayerStack.Outputs.ComputeSecurityGroup

  CognitoPostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CognitoPostConfirmation
      Principal: cognito-idp.amazonaws.com
      Action: lambda:InvokeFunction
      SourceArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"

###########Other Resources###########
  CodeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: CodeQueue
      MaximumMessageSize: 10240
      MessageRetentionPeriod: 3600
      ReceiveMessageWaitTimeSeconds: 10
      #Dead letter queue settings currently not implemented.

  ReceiveFromQueueSQSTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CodeQueue.Arn
      FunctionName: !Ref InvokeFargate
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      Enabled: True

  CodeRunCluster:
    Type: AWS::ECS::Cluster
    Properties:
      CapacityProviders:
        - FARGATE

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"

  CodeRunTaskDefinitionPython:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ExecutionRoleArn: !GetAtt CodeRunExecutionRole.Arn
      TaskRoleArn: !GetAtt CodeRunTaskRole.Arn
      Cpu: "256"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ContainerDefinitions:
        - Name: code-run-image-python
          Image: 346225466066.dkr.ecr.us-east-2.amazonaws.com/code-run-image-python:latest
          Essential: true
          #MemoryReservation could be implemented later so that less memory is used when 1 GB isn't needed
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: Code-Run-Container

  CodeRunTaskDefinitionCpp:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ExecutionRoleArn: !GetAtt CodeRunExecutionRole.Arn
      TaskRoleArn: !GetAtt CodeRunTaskRole.Arn
      Cpu: "256"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ContainerDefinitions:
        - Name: code-run-image-cpp
          Image: 346225466066.dkr.ecr.us-east-2.amazonaws.com/code-run-image-cpp:latest
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: Code-Run-Container
  #Note: A different CodeRunTaskDefinition is needed for every support language

  ######################## WebSocket Resources ########################
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-WebSocketConnections"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-WebSocketApi"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true

  WebSocketHandlerIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WebSocketHandlerPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ConnectionsTable.Arn
                  - !Sub "${ConnectionsTable.Arn}/index/*"

  WebSocketHandler:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt WebSocketHandlerIAMRole.Arn
      Runtime: python3.12
      FunctionName: !Sub "${AWS::StackName}-websocket-handler"
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Sub "${LambdaCodeS3KeyPrefix}websocket-handler.zip"
      Handler: index.lambda_handler
      Timeout: 15

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketHandler.Arn}/invocations"

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketHandler.Arn}/invocations"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub "integrations/${ConnectIntegration}"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${DisconnectIntegration}"

  WebSocketHandlerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketHandler
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*"

Outputs:
  WebSocketApiEndpoint:
    Description: WebSocket API endpoint URL for frontend connection
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${AWS::StackName}-WebSocketEndpoint"

  WebSocketApiEndpointHttps:
    Description: WebSocket API endpoint URL (HTTPS format) for environment variable
    Value: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${AWS::StackName}-WebSocketEndpointHttps"

  ConnectionsTableName:
    Description: DynamoDB table name for WebSocket connections
    Value: !Ref ConnectionsTable
    Export:
      Name: !Sub "${AWS::StackName}-ConnectionsTable"